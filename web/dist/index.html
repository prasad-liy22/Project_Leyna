<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Nimna — a warm, Sinhala-speaking personal assistant." />

  <!-- API Base configuration -->
  <meta name="leyna-api-base" content="https://project-leyna.vercel.app" />

  <title>Nimna — Personal Assistant</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%AB%3C/text%3E%3C/svg%3E" />

  <script>
    (function () {
      var saved = null;
      try {
        saved = localStorage.getItem("leyna.theme");
      } catch (error) { }
      var dark = saved
        ? saved === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Flutter Web initialization script -->
  <script src="flutter.js" defer></script>
</head>

<body>
  <script>
    window.addEventListener('load', function (ev) {
      // Download main.dart.js and initialize Flutter app
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>

  <!-- Login overlay -->
  <div id="login-overlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/90 backdrop-blur-sm">
    <div class="card w-full max-w-sm p-6 space-y-4 mx-4">
      <div class="text-center space-y-1">
        <div class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-gradient-to-br from-violet-500 to-indigo-500 text-xl shadow-lg shadow-violet-950/40">
          💫
        </div>
        <h2 class="text-lg font-semibold text-ink">Sign in to Nimna</h2>
        <p class="text-xs text-ink-faint">Enter your credentials to continue</p>
      </div>
      <form id="login-form" class="space-y-3">
        <label class="block space-y-1.5">
          <span class="text-xs font-semibold tracking-wide text-ink-faint uppercase">Username</span>
          <input id="login-user" class="field" placeholder="Username" autocomplete="username" required />
        </label>
        <label class="block space-y-1.5">
          <span class="text-xs font-semibold tracking-wide text-ink-faint uppercase">Password</span>
          <input id="login-pass" type="password" class="field" placeholder="Password" autocomplete="current-password" required />
        </label>
        <button class="btn btn-primary w-full" type="submit">Login</button>
      </form>
      <p id="login-error" class="text-xs text-rose-500 hidden text-center"></p>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>

</html>
